{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_class %}page--narrow{% endblock %}
{% block content %}
<div class="empty it-dots">
  <p class="eyebrow">Помилка {{ code }}</p>
  <p class="empty__title">{{ title }}</p>
  {% if error and error.description and code == 400 %}<p>{{ error.description }}</p>{% endif %}
  <p style="margin-top:16px"><a class="btn btn--primary" href="{{ url_for('public.home') }}">На головну</a></p>
</div>
{% endblock %}
